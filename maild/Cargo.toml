[package]
name = "maild"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Mail sync service for omarchy-mail"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
libc = "0.2"
mail-parser = "0.11"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
serde_json = "1"
